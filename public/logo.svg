<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 40" fill="none">
  <!--
    Minimalist wordmark, 72x40 canvas.

    Mark = two interlocking rings (chain-link / Olympic illusion).
    Intersections at (14, 11.94) and (14, 28.06). Render order:
      1. purple ring (full)
      2. teal ring (full) — currently covers purple at BOTH crossings
      3. short purple arc over TOP crossing only

    Result: top crossing shows purple on top, bottom crossing shows
    teal on top → rings appear woven / linked.

    Gradients are userSpaceOnUse so the overlay arc blends seamlessly
    with the underlying ring 1 (shared color stops in absolute coords).
  -->

  <defs>
    <linearGradient id="lg-purple" x1="0" y1="11" x2="0" y2="29" gradientUnits="userSpaceOnUse">
      <stop offset="0%"  stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="lg-teal" x1="0" y1="11" x2="0" y2="29" gradientUnits="userSpaceOnUse">
      <stop offset="0%"  stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="text-shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="0.5" stdDeviation="0.4" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Interlocking rings — r=9 (slightly larger mark while text stays put).
       Stroke held at 1.75 so the lines don't read as heavier, only bigger.
       Round linecaps so the weave overlay blends seamlessly with ring 1. -->
  <g fill="none" stroke-width="1.75" stroke-linecap="round">
    <circle cx="10" cy="20" r="9" stroke="url(#lg-purple)"/>
    <circle cx="18" cy="20" r="9" stroke="url(#lg-teal)"/>
    <!-- Weave overlay: 30° arc centered on top intersection (θ=-78.6° to -48.6°). -->
    <path d="M 11.78 11.18 A 9 9 0 0 1 15.95 13.25" stroke="url(#lg-purple)"/>
  </g>

  <!-- Wordmark -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" fill="#ffffff" filter="url(#text-shadow)">
    <text x="33" y="19" font-size="10.5" font-weight="600" letter-spacing="0.35">Collab</text>
    <text x="33" y="32" font-size="10.5" font-weight="600" letter-spacing="-0.2">Planner</text>
  </g>
</svg>
