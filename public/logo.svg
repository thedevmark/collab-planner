<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 40" fill="none">
  <!--
    Minimalist wordmark. 72x40 canvas.
    Mark (overlapping rings) on the left, two-line sans-serif
    wordmark on the right. Gradient rings: purple + teal, same
    brand hues as before but rendered as smooth strokes, not
    pixel bevels.
  -->

  <defs>
    <linearGradient id="lg-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="lg-teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>

  <!-- Overlapping rings (Venn mark) -->
  <g stroke-width="1.75" stroke-linecap="round">
    <circle cx="10" cy="20" r="8" stroke="url(#lg-purple)"/>
    <circle cx="18" cy="20" r="8" stroke="url(#lg-teal)"/>
  </g>

  <!-- Wordmark -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" fill="#ffffff">
    <text x="31" y="19" font-size="10.5" font-weight="600" letter-spacing="-0.2">Collab</text>
    <text x="31" y="32" font-size="10.5" font-weight="400" letter-spacing="0.35" opacity="0.55">Planner</text>
  </g>
</svg>
