<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!--
    Schedule Forecast — extension icon.
    App-icon shape (rounded badge + flat illustration + long shadow), but
    branded for Collab Planner:
      - Badge: deep-purple radial gradient (matches dashboard mockups).
      - Calendar: cream/off-white body with a brand-purple header band
        and two binder rings on top.
      - 4×3 date grid: muted lavender cells, ONE highlighted teal cell
        — that's "the predicted day this streamer goes live."
      - Inset chip (bottom-right): teal rounded square with a tiny
        upward forecast curve in white — reads "prediction / trend."
      - Long diagonal shadow inside the badge for depth.
  -->
  <defs>
    <radialGradient id="badge" cx="0.3" cy="0.25" r="0.95">
      <stop offset="0%" stop-color="#2e1a52"/>
      <stop offset="100%" stop-color="#0d0518"/>
    </radialGradient>
    <linearGradient id="cal-header" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a875ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="cal-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#e6dcff"/>
    </linearGradient>
    <linearGradient id="inset" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <clipPath id="badge-clip">
      <circle cx="50" cy="50" r="50"/>
    </clipPath>
    <filter id="cal-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5"/>
      <feOffset dx="1" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="inset-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2"/>
      <feOffset dx="1" dy="1.5"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Round badge background -->
  <circle cx="50" cy="50" r="50" fill="url(#badge)"/>

  <!-- Long diagonal interior shadow (subtle, only over the badge area) -->
  <g clip-path="url(#badge-clip)" opacity="0.22">
    <polygon points="100,40 100,100 40,100" fill="#000"/>
  </g>

  <!-- Binder rings -->
  <rect x="31" y="20" width="4" height="9" rx="1.5" fill="#2a1a44"/>
  <rect x="65" y="20" width="4" height="9" rx="1.5" fill="#2a1a44"/>

  <!-- Calendar body with shadow -->
  <g filter="url(#cal-shadow)">
    <rect x="20" y="26" width="60" height="54" rx="5" fill="url(#cal-body)"/>
    <!-- Header band -->
    <path d="M 20 31 a 5 5 0 0 1 5 -5 h 50 a 5 5 0 0 1 5 5 v 8 h -60 z" fill="url(#cal-header)"/>
  </g>

  <!-- Date grid: 4 cols × 3 rows, gap 2, cell ~10×8 -->
  <!-- Origin: x=25, y=43; col stride 13, row stride 11 -->
  <g fill="#c4b5fd">
    <!-- row 1 -->
    <rect x="25" y="43"  width="10" height="8" rx="1.5"/>
    <rect x="38" y="43"  width="10" height="8" rx="1.5"/>
    <rect x="51" y="43"  width="10" height="8" rx="1.5"/>
    <rect x="64" y="43"  width="10" height="8" rx="1.5"/>
    <!-- row 2 -->
    <rect x="25" y="54"  width="10" height="8" rx="1.5"/>
    <rect x="38" y="54"  width="10" height="8" rx="1.5"/>
    <!-- highlighted "predicted" cell at row 2, col 3 -->
    <rect x="51" y="54"  width="10" height="8" rx="1.5" fill="url(#inset)"/>
    <rect x="64" y="54"  width="10" height="8" rx="1.5"/>
    <!-- row 3 -->
    <rect x="25" y="65"  width="10" height="8" rx="1.5"/>
    <rect x="38" y="65"  width="10" height="8" rx="1.5"/>
    <rect x="51" y="65"  width="10" height="8" rx="1.5"/>
    <rect x="64" y="65"  width="10" height="8" rx="1.5"/>
  </g>

  <!-- Inset chip (bottom-right): forecast curve -->
  <g filter="url(#inset-shadow)">
    <rect x="58" y="58" width="30" height="30" rx="6" fill="url(#inset)" stroke="#0d0518" stroke-width="1.5"/>
    <!-- Forecast line: rising trend with arrow head -->
    <polyline
      points="63,80 69,76 74,78 81,69"
      fill="none" stroke="#ffffff" stroke-width="2.2"
      stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Arrow head at the upper-right end -->
    <polyline
      points="77,69 81,69 81,73"
      fill="none" stroke="#ffffff" stroke-width="2.2"
      stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Dotted future projection -->
    <line x1="81" y1="69" x2="85" y2="65"
      stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"
      stroke-dasharray="0.5 2.5" opacity="0.7"/>
  </g>
</svg>
